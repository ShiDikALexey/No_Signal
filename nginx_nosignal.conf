server {
    listen 80;
    server_name nosignal.su www.nosignal.su;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nosignal.su www.nosignal.su;

    ssl_certificate /etc/letsencrypt/live/nosignal.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nosignal.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain application/json;

    client_max_body_size 25M;

    location /static/ {
        alias /opt/nosignal/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        alias /opt/nosignal/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /favicon.ico {
        alias /opt/nosignal/static/favicon.svg;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
